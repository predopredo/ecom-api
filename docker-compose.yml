services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom_backend
    ports:
      - "80:80"
      - "3000:80"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-development_secret_key_base_1234567890}
    volumes:
      - rails_storage:/rails/storage
      - rails_sqlite:/rails/db/storage

volumes:
  rails_storage:
  rails_sqlite:
